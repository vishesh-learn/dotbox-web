<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DotBox</title>

  <link rel="shortcut icon" href="../icon.png" />
  <link rel="stylesheet" href="../lib/global.css" />
  <link rel="stylesheet" href="main.css">
</head>

<body>
  <div class="page-bg"></div>

  <header>
    <svg class="button" tabindex="0" id="backButton" width="200" height="200" viewBox="0 0 52.916666 52.916666"
      xmlns="http://www.w3.org/2000/svg">
      <path transform="translate(0,-244.08334)"
        d="m 7.2183776,270.23195 c 0,0 1.4153437,-11.53004 13.3772454,-18.37613 11.617097,-6.64875 12.428033,7.01583 12.428033,7.01583 0,0 9.196528,-0.16797 9.115464,11.92727 -0.129103,11.62277 -9.115464,11.62277 -9.115464,11.62277 0,0 -0.85885,12.95898 -12.295478,6.59796 C 8.6357883,281.5361 7.2183776,270.23195 7.2183776,270.23195 Z" />
    </svg>
    <div id="info"></div>
  </header>

  <div class="page-content">
    <div class="playerList"></div>

    <svg class="button addb" tabindex="0" xmlns="http://www.w3.org/2000/svg" width="100" height="100"
      viewBox="0 0 100 100">

      <circle r="45" cx="50" cy="50" />

      <polyline points="50,25 50,75" />

      <polyline points="25,50 75,50" />
    </svg>

    <div class="pop-up-bg"></div>

    <div class="pop-up set-color">
      <div class="color-hue">
        <button class="avatar colorBall" hue="0" style="background-color: hsl(0, 70%, 70%);"></button>
        <button class="avatar colorBall" hue="30" style="background-color: hsl(30, 70%, 70%);"></button>
        <button class="avatar colorBall" hue="60" style="background-color: hsl(60, 70%, 70%);"></button>
        <button class="avatar colorBall" hue="90" style="background-color: hsl(90, 70%, 70%);"></button>
        <button class="avatar colorBall" hue="120" style="background-color: hsl(120, 70%, 70%);"></button>
        <button class="avatar colorBall" hue="150" style="background-color: hsl(150, 70%, 70%);"></button>
        <button class="avatar colorBall" hue="180" style="background-color: hsl(180, 70%, 70%);"></button>
        <button class="avatar colorBall" hue="210" style="background-color: hsl(210, 70%, 70%);"></button>
        <button class="avatar colorBall" hue="240" style="background-color: hsl(240, 70%, 70%);"></button>
        <button class="avatar colorBall" hue="270" style="background-color: hsl(270, 70%, 70%);"></button>
        <button class="avatar colorBall" hue="300" style="background-color: hsl(300, 70%, 70%);"></button>
        <button class="avatar colorBall" hue="330" style="background-color: hsl(330, 70%, 70%);"></button>
      </div>
    </div>
  </div>

  <footer>
    <button class="button" tabindex="0" id="nextButton">NEXT</button>
  </footer>

  <script src="../lib/color.js" charset="utf-8"></script>
  <script src="../lib/global.js"></script>
  <script src="main.js" charset="utf-8"></script>
</body>

</html>
