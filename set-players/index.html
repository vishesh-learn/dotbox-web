<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DotBox</title>

  <link rel="shortcut icon" href="../icon.png" />
  <link rel="stylesheet" href="../lib/global.css" />
  <link rel="stylesheet" href="main.css">
</head>

<body>
  <div class="page-bg"></div>

  <header>
    <div class="left">
      <svg class="icon button" tabindex="0" id="backButton" width="30" height="30" viewBox="0 0 133 155" xmlns="http://www.w3.org/2000/svg">
        <path
            d="M0.282059 76.8295C0.282059 76.8295 5.63139 33.2513 50.8417 7.37631C94.7489 -17.7528 97.8138 33.8928 97.8138 33.8928C97.8138 33.8928 132.572 33.258 132.266 78.9723C131.778 122.901 97.8138 122.901 97.8138 122.901C97.8138 122.901 94.5678 171.88 51.3427 147.838C5.6392 119.554 0.282059 76.8295 0.282059 76.8295Z"
            />
      </svg>

      <svg class="icon button" tabindex="0" id="homeButton" width="30" height="30" viewBox="0 0 214 200"
        xmlns="http://www.w3.org/2000/svg">
        <path
          d="M107 0C107 0 147 0 197 60C247 120 166.029 136.764 166.029 136.764C166.029 136.764 167 200 107 199.997C47 200 47.3282 136.764 47.3282 136.764C47.3282 136.764 -33 120 17 60C67 0 107 0 107 0Z" />
      </svg>
    </div>
    
    <div id="info"></div>
  </header>

  <div class="page-content">
    <div class="playerList"></div>

    <svg class="button addb" tabindex="0" xmlns="http://www.w3.org/2000/svg" width="100" height="100"
      viewBox="0 0 100 100">

      <circle r="45" cx="50" cy="50" />

      <polyline points="50,25 50,75" />

      <polyline points="25,50 75,50" />
    </svg>

    <div class="pop-up-bg"></div>

    <div class="pop-up set-color">
      <button class="button close-pop-up">✕</button>

      <div class="avatar color-prev"></div>

      <div class="color-hue">
        <button class="button avatar colorBall" hue="0" style="background-color: hsl(0, 70%, 70%);"></button>
        <button class="button avatar colorBall" hue="30" style="background-color: hsl(30, 70%, 70%);"></button>
        <button class="button avatar colorBall" hue="60" style="background-color: hsl(60, 70%, 70%);"></button>
        <button class="button avatar colorBall" hue="90" style="background-color: hsl(90, 70%, 70%);"></button>
        <button class="button avatar colorBall" hue="120" style="background-color: hsl(120, 70%, 70%);"></button>
        <button class="button avatar colorBall" hue="150" style="background-color: hsl(150, 70%, 70%);"></button>
        <button class="button avatar colorBall" hue="180" style="background-color: hsl(180, 70%, 70%);"></button>
        <button class="button avatar colorBall" hue="210" style="background-color: hsl(210, 70%, 70%);"></button>
        <button class="button avatar colorBall" hue="240" style="background-color: hsl(240, 70%, 70%);"></button>
        <button class="button avatar colorBall" hue="270" style="background-color: hsl(270, 70%, 70%);"></button>
        <button class="button avatar colorBall" hue="300" style="background-color: hsl(300, 70%, 70%);"></button>
        <button class="button avatar colorBall" hue="330" style="background-color: hsl(330, 70%, 70%);"></button>
      </div>
    </div>
  </div>

  <footer>
    <button class="button" tabindex="0" id="nextButton">CONTINUE</button>
  </footer>

  <script src="../lib/color.js" charset="utf-8"></script>
  <script src="../lib/global.js"></script>
  <script src="main.js" charset="utf-8"></script>
</body>

</html>
