<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Game</title>

    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="main.css" />
</head>
<body>
  <header>
    <button id="backButton"></button>
  </header>

  <div class="playerTurn">
    <div class="frame">
      <div class="playerTurnList"></div>
    </div>
  </div>

  <div class="svgC">
    <svg xmlns="http://www.w3.org/2000/svg" class="boxSVG"></svg>
    <svg xmlns="http://www.w3.org/2000/svg" class="lineSVG"></svg>
    <svg xmlns="http://www.w3.org/2000/svg" class="dotSVG"></svg>
  </div>

  <div class="winBoard noneDisplay">
    <div class="playerRankList">
      <div class="player">
        <div class="rank">0</div>
        <div class="avatar"></div>
        <div class="playerName">player name</div>
        <div class="score">1</div>
      </div>
    </div>
  </div>

  <script src="../lib/color.js" charset="utf-8"></script>
  <script src="../main.js"></script>
  <script src="main.js"></script>
</body>
</html>
