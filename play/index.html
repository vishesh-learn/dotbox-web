<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DotBox Web - Play</title>

  <link rel="shortcut icon" href="../icon.png" />
  <link rel="stylesheet" href="../lib/global.css" />
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="../lib/globalMediaQuery.css">
  <link rel="stylesheet" href="mediaQuery.css">
</head>

<body>
  <div class="page-bg"></div>

  <header>
    <div class="playerTurn">
      <div class="playerTurnList"></div>
    </div>

    <svg class="icon button" tabindex="0" id="homeButton" width="30" height="30" viewBox="0 0 214 200"
      xmlns="http://www.w3.org/2000/svg">
      <path
        d="M107 0C107 0 147 0 197 60C247 120 166.029 136.764 166.029 136.764C166.029 136.764 167 200 107 199.997C47 200 47.3282 136.764 47.3282 136.764C47.3282 136.764 -33 120 17 60C67 0 107 0 107 0Z" />
    </svg>
  </header>

  <div class="page-content">
    <div class="svgC">
      <svg xmlns="http://www.w3.org/2000/svg" class="boxSVG">
        <defs class="boxDefs"></defs>
        <g class="boxG"></g>
      </svg>
  
      <svg xmlns="http://www.w3.org/2000/svg" class="lineSVG"></svg>
      <svg xmlns="http://www.w3.org/2000/svg" class="dotSVG"></svg>
    </div>
  </div>

  <footer>
    <div class="infoBar">
      <div class="info curr-player-id">
        <div class="label">ID: </div>
        <div class="value"></div>
      </div>
      <div class="info curr-player-name">
        <div class="label">Name: </div>
        <div class="value"></div>
      </div>
      <div class="info curr-player-score">
        <div class="label">Score: </div>
        <div class="value"></div>
      </div>
      <div class="info rowAndCol">
        <div class="label">Board: </div>
        <div class="value"></div>
      </div>
    </div>
  </footer>

  <div class="pop-up-bg"></div>

  <div class="pop-up winBoard">
    <div class="playerRankList"></div>
    <div class="bar">
      <button class="button" tabindex="0" id="replayButton">REPLAY</button>
      <button class="button" tabindex="0" id="newGameButton">NEW GAME</button>
    </div>
  </div>

  <script src="../lib/color.js"></script>
  <script src="../lib/global.js"></script>

  <script src="js/data.js"></script>
  <script src="main.js"></script>
  <script src="js/setup.js"></script>
  <script src="js/createUI.js"></script>
  <script src="js/converter.js"></script>
  <script src="js/gameEvents.js"></script>
  <script src="js/algo.js"></script>
  <script src="js/validation.js"></script>
</body>

</html>
