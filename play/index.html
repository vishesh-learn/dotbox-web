<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotBox - Playboard</title>

    <link rel="shortcut icon" href="../icon.png" />
    <link rel="stylesheet" href="../lib/global.css" />
    <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div class="page-bg"></div>

  <svg class="button" tabindex="0" id="backButton" width="200" height="200" viewBox="0 0 52.916666 52.916666" xmlns="http://www.w3.org/2000/svg">
    <path transform="translate(0,-244.08334)" d="m 7.2183776,270.23195 c 0,0 1.4153437,-11.53004 13.3772454,-18.37613 11.617097,-6.64875 12.428033,7.01583 12.428033,7.01583 0,0 9.196528,-0.16797 9.115464,11.92727 -0.129103,11.62277 -9.115464,11.62277 -9.115464,11.62277 0,0 -0.85885,12.95898 -12.295478,6.59796 C 8.6357883,281.5361 7.2183776,270.23195 7.2183776,270.23195 Z"/>
  </svg>

  <header>
    <div class="playerTurn">
      <div class="playerTurnList"></div>
    </div>
  </header>

  <div class="svgC">
    <svg xmlns="http://www.w3.org/2000/svg" class="boxSVG">
      <defs class="boxDefs"></defs>
      <g class="boxG"></g>
    </svg>

    <svg xmlns="http://www.w3.org/2000/svg" class="lineSVG"></svg>
    <svg xmlns="http://www.w3.org/2000/svg" class="dotSVG"></svg>
  </div>

  <footer class="footBar">
    <div class="info rowAndCol"></div>
  </footer>

  <div class="winBoard">
    <div class="playerRankList"></div>
    <div class="bar">
      <button class="button" tabindex="0" id="replayButton">REPLAY</button>
      <button class="button" tabindex="0" id="newGameButton">NEW GAME</button>
    </div>
  </div>

  <script src="../lib/color.js"></script>
  <script src="../lib/global.js"></script>
  <script src="main.js"></script>
  <script src="setup.js"></script>
  <script src="createUI.js"></script>
  <script src="converter.js"></script>
  <script src="gameEvents.js"></script>
  <script src="algo.js"></script>
</body>
</html>
