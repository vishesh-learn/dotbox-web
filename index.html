<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="keywords" content="dotbox, android gaming application, the traditional game dots and boxes">

  <meta name="description"
    content="DotBox is an Android gaming application, a digitally advanced version of the traditional game 'Dots and Boxes'.">

  <link rel="manifest" href="dotbox.webmanifest" />

  <title>DotBox</title>

  <link rel="shortcut icon" href="icon.png" />
  <link rel="stylesheet" href="dist/common/css/global.css" />
  <link rel="stylesheet" href="dist/main.css" />
</head>

<body>
  <div class="page-bg"></div>

  <header>
    <share-button tabindex="0" class="button"></share-button>
  </header>

  <div class="page-content">
    <div id="home-menu">
      <button class="button" id="continueButton">Continue</button>
      <button class="button" id="newGameButton">New Game</button>
      <button class="button" id="savedGamesButton">Saved Games</button>
    </div>
  </div>

  <footer>
    <div class="version displayNone"></div>

    <div class="versionSeparator displayNone">|</div>

    <a href="/pages/privacy-policy/" class="button privacy-policy-link" tabindex="0">
      privacy-policy
    </a>

    <div class="versionSeparator">|</div>

    <a href="/pages/credits/" class="button privacy-policy-link" tabindex="0">credits</a>
  </footer>

  <dialog class="saved-games">
    <button class="button close-pop-up">✕</button>

    <div class="games-list"></div>
  </dialog>

  <script type="module" src="dist/main.js"></script>
</body>

</html>
