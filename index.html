<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="keywords" content="dotbox, android gaming application, the traditional game dots and boxes">

  <meta name="description" content="DotBox is an Android gaming application, a digitally advanced version of the traditional game 'Dots and Boxes'.">

  <link rel="manifest" href="dotbox.webmanifest" />

  <title>DotBox Web</title>

  <link rel="shortcut icon" href="icon.png" />
  <link rel="stylesheet" href="lib/global.css" />
  <link rel="stylesheet" href="main.css" />
</head>

<body>
  <div class="page-bg"></div>

  <svg class="button share-button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" preserveAspectRatio="none"
    tabindex="0">
    <line class="line" x1="32" y1="13.5" x2="18" y2="20.5" />
    <line class="line" x1="18" y1="29.5" x2="32" y2="36.5" />
    <circle class="dot" r="7" cx="41" cy="9" />
    <circle class="dot" r="7" cx="9" cy="25" />
    <circle class="dot" r="7" cx="41" cy="41" />
  </svg>

  <div class="page-content">
    <div id="home-menu">
      <button class="button" id="continueButton">Continue</button>
      <button class="button" id="newGameButton">New Game</button>
    </div>
  </div>

  <footer>
    <div class="version displayNone"></div>
    <div class="versionSeparator displayNone">|</div>
    <div class="button privacy-policy-link" tabindex="0">privacy-policy</div>
  </footer>

  <script src="lib/color.js"></script>
  <script src="lib/global.js"></script>
  <script src="variations/platform-specific-home.js"></script>
  <script src="main.js"></script>
</body>

</html>
