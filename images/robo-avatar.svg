<?xml version="1.0" encoding="UTF-8" standalone="no"?>

<svg class="robo-avatar" width="510" height="400"
  viewBox="0 0 75 50"
  xmlns="http://www.w3.org/2000/svg">
  <style>
    svg {
    fill: hsl(50, 70%, 70%);
    stroke: hsl(0, 100%, 10%);
    stroke-width: 4;
    stroke-linecap: round;
    }
    .antenna {
    stroke-width: 4;
    }
    .antenna-point {
    fill: black;
    stroke-width: 5;
    }
  </style>

  <circle class="ear left" r="8" cx="16" cy="30" />
  <circle class="ear right" r="5" cx="62" cy="30" />

  <line class="antenna left" x1="18" y1="15" x2="6" y2="2" />
  <circle class="antenna-point left" r="2" cx="6" cy="2" />

  <line class="antenna right" x1="56" y1="14" x2="67" y2="3" />
  <circle class="antenna-point right" r="2" cx="67" cy="3" />

  <ellipse class="face" cx="38" cy="30" rx="25" ry="20" />

  <circle class="eye left" r="5" cx="28" cy="25" />
  <circle class="eye right" r="4" cx="48" cy="25" />

  <path class="smile" d="M28 38 Q38 43  48 38" />

  <image x="20" y="2" width="7" height="7" href="heart.png" />

  <image x="64" y="12" width="6" height="6" href="heart.png" />
</svg>